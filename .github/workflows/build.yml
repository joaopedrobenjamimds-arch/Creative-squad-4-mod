name: Build CS4 Reliquias Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack latest ZIP and locate Gradle root
        id: locate
        run: |
          LATEST_ZIP=$(git -c core.quotepath=false log -n 1 --diff-filter=AM --name-only --pretty=format: -- '*.zip' | head -n 1)
          if [ -z "$LATEST_ZIP" ] || [ ! -f "$LATEST_ZIP" ]; then
            LATEST_ZIP=$(find . -maxdepth 2 -name "*.zip" -printf "%T@ %p\n" | sort -nr | head -n 1 | cut -d' ' -f2-)
          fi

          if [ -n "$LATEST_ZIP" ] && [ -f "$LATEST_ZIP" ]; then
            echo "Compilando ZIP mais recente: $LATEST_ZIP"
            rm -rf _build_src
            mkdir -p _build_src
            unzip -o "$LATEST_ZIP" -d _build_src
            FOUND=$(find _build_src -maxdepth 3 -name "settings.gradle" -printf "%h\n" | head -n 1)
          else
            FOUND=$(find . -maxdepth 3 -name "settings.gradle" -printf "%h\n" | head -n 1)
          fi

          if [ -z "$FOUND" ]; then
            echo "Erro: settings.gradle nao encontrado. Envie o arquivo .zip do projeto para o repositorio."
            exit 1
          fi
          CLEAN=${FOUND#./}
          if [ "$CLEAN" = "." ] || [ -z "$CLEAN" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
            echo "libs=build/libs" >> "$GITHUB_OUTPUT"
          else
            echo "dir=$CLEAN" >> "$GITHUB_OUTPUT"
            echo "libs=$CLEAN/build/libs" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build Mod JAR
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle build

      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: cs4-reliquias-1.21.4-jar
          path: |
            ${{ steps.locate.outputs.libs }}/*.jar
