name: Build CS4 Reliquias Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack ZIP if uploaded directly
        run: |
          if [ ! -f "settings.gradle" ]; then
            find . -maxdepth 2 -name "*.zip" -exec unzip -o {} \;
          fi

      - name: Locate Gradle root
        id: locate
        run: |
          FOUND=$(find . -maxdepth 3 -name "settings.gradle" -printf "%h\n" | head -n 1)
          if [ -z "$FOUND" ]; then
            echo "Erro: settings.gradle nao encontrado. Envie o arquivo cs4-reliquias-fabric-1.21.4.zip para o repositorio."
            exit 1
          fi
          CLEAN=${FOUND#./}
          if [ "$CLEAN" = "." ] || [ -z "$CLEAN" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
            echo "libs=build/libs" >> "$GITHUB_OUTPUT"
          else
            echo "dir=$CLEAN" >> "$GITHUB_OUTPUT"
            echo "libs=$CLEAN/build/libs" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build Mod JAR
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle build

      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: cs4-reliquias-1.21.4-jar
          path: |
            ${{ steps.locate.outputs.libs }}/*.jar
            !${{ steps.locate.outputs.libs }}/*-sources.jar
